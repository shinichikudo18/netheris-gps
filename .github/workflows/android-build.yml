name: Build Netheris GPS APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 35
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Katherine avatar resource
        run: python3 scripts/apply_v8_avatar.py

      - name: Apply Netheris v8 UI
        run: python3 scripts/apply_v8_ui.py

      - name: Apply Netheris v8 shell
        run: python3 scripts/apply_v8_shell.py

      - name: Apply Android 16 navigation hotfix
        run: python3 scripts/apply_v8_0_1_hotfix.py

      - name: Apply smart one-touch navigation
        run: python3 scripts/apply_v8_1_smart_start.py

      - name: Apply v8.2 optimization and clean reset
        run: python3 scripts/apply_v8_2_cleanup_speed.py

      - name: Apply v8.2.1 unified stop
        run: python3 scripts/apply_v8_2_1_unified_stop.py

      - name: Apply v8.2.2 start stability fix
        run: python3 scripts/apply_v8_2_2_start_stability.py

      - name: Apply v9 Trip Center
        run: python3 scripts/apply_v9_trip_center.py

      - name: Apply v9.1 adaptive dock and bottom sheet
        run: python3 scripts/apply_v9_1_bottom_sheet_dock.py

      - name: Apply v10 smart camera and arrival
        run: python3 scripts/apply_v10_smart_camera_arrival.py

      - name: Apply v10 import fix
        run: python3 scripts/apply_v10_0_1_import_fix.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: netheris-gps-v10.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
