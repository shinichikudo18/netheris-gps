name: Build Netheris GPS APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 35
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Katherine avatar resource
        run: python3 scripts/apply_v8_avatar.py

      - name: Apply Netheris v8 UI
        run: python3 scripts/apply_v8_ui.py

      - name: Apply Netheris v8 shell
        run: python3 scripts/apply_v8_shell.py

      - name: Apply Android 16 navigation hotfix
        run: python3 scripts/apply_v8_0_1_hotfix.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: netheris-gps-v8.0.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
