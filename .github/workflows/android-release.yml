name: Build Signed Netheris GPS Release

"on":
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-release.yml"
      - "scripts/configure_release_signing.py"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 35
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Apply Netheris build patches
        run: |
          python3 scripts/apply_v8_avatar.py
          python3 scripts/apply_v8_ui.py
          python3 scripts/apply_v8_shell.py
          python3 scripts/apply_v8_0_1_hotfix.py
          python3 scripts/apply_v8_1_smart_start.py
          python3 scripts/apply_v8_2_cleanup_speed.py
          python3 scripts/apply_v8_2_1_unified_stop.py
          python3 scripts/apply_v8_2_2_start_stability.py
          python3 scripts/apply_v9_trip_center.py
          python3 scripts/apply_v9_1_bottom_sheet_dock.py
          python3 scripts/apply_v10_smart_camera_arrival.py
          python3 scripts/apply_v10_0_1_import_fix.py
          python3 scripts/apply_v10_1_nav_sync_compact_search.py
          python3 scripts/apply_v10_1_1_forward_ref_fix.py
          python3 scripts/apply_v10_1_1_visible_nav_controls.py
          python3 scripts/apply_v11_navigation_core_optimization.py
          python3 scripts/apply_v12_navigation_experience.py
          python3 scripts/apply_v12_0_1_visible_controls.py
          python3 scripts/apply_v13_landscape_intelligent_navigation.py
          python3 scripts/apply_v13_0_1_start_hotfix.py
          python3 scripts/apply_v13_1_landscape_overlay.py
          python3 scripts/apply_v13_1_1_compact_landscape_hud.py
          python3 scripts/apply_v14_travel_mode.py
          python3 scripts/apply_v15_netheris_integration.py

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.NETHERIS_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/netheris-release.jks"
          test -s "$GITHUB_WORKSPACE/netheris-release.jks"

      - name: Configure release signing
        env:
          NETHERIS_STORE_FILE: ${{ github.workspace }}/netheris-release.jks
          NETHERIS_STORE_PASSWORD: ${{ secrets.NETHERIS_KEYSTORE_PASSWORD }}
          NETHERIS_KEY_ALIAS: ${{ secrets.NETHERIS_KEY_ALIAS }}
          NETHERIS_KEY_PASSWORD: ${{ secrets.NETHERIS_KEY_PASSWORD }}
        run: python3 scripts/configure_release_signing.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build signed release APK and AAB
        env:
          NETHERIS_STORE_FILE: ${{ github.workspace }}/netheris-release.jks
          NETHERIS_STORE_PASSWORD: ${{ secrets.NETHERIS_KEYSTORE_PASSWORD }}
          NETHERIS_KEY_ALIAS: ${{ secrets.NETHERIS_KEY_ALIAS }}
          NETHERIS_KEY_PASSWORD: ${{ secrets.NETHERIS_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify APK signature
        run: /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release
        uses: actions/upload-artifact@v4
        with:
          name: netheris-gps-v15.1-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
